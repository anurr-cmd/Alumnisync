{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'view_jobs.css' %}">
    <title>Document</title>
</head>
<body>
    <h2>Job Opportunities</h2>

<div class="job-container">
{% for job in jobs %}
    <div class="job-card">
        <h3>{{ job.title }}</h3>
        <p><b>{{ job.company }}</b></p>
        <p>{{ job.description }}</p>
        <small>{{ job.posted_on }}</small>
    </div>
{% endfor %}
</div>

</body>
</html>
